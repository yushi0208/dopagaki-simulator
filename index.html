<!DOCTYPE html>

<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport"

      content="width=device-width,

               initial-scale=1.0,

               maximum-scale=1.0,

               user-scalable=no">

<title></title>

<style>

* {

  box-sizing: border-box;

  -webkit-tap-highlight-color: transparent;

}

html,

body {

  margin: 0;

  padding: 0;

  width: 100%;

  height: 100%;

  overflow: hidden;

  background: #000;

}

#feed {

  position: fixed;

  inset: 0;

  width: 100%;

  height: 100%;

  overflow: hidden;

  touch-action: none;

  background: #000;

}

/* 動画 */

.video {

  position: absolute;

  inset: 0;

  width: 100%;

  height: 100%;

  object-fit: cover;

  transition: transform 0.35s ease;

  pointer-events: none;

}

/* 次の動画 */

#next {

  transform: translateY(100%);

}

</style>

</head>

<body>

<div id="feed">

  <!-- 現在の動画 -->

  <video

    id="current"

    class="video"

    src="short.mp4"

    autoplay

    muted

    playsinline

    loop>

  </video>

  <!-- 次の動画 -->

  <video

    id="next"

    class="video"

    src="short.mp4"

    autoplay

    muted

    playsinline

    loop>

  </video>

</div>

<script>

const feed = document.getElementById("feed");

const current = document.getElementById("current");

const next = document.getElementById("next");

let startY = 0;

let currentY = 0;

let swiping = false;

let changing = false;

/* =========================

   スワイプ開始

========================= */

feed.addEventListener("touchstart", function(e) {

  if (e.touches.length !== 1) return;

  startY = e.touches[0].clientY;

  currentY = startY;

  swiping = true;

}, { passive: false });

/* =========================

   スワイプ中

========================= */

feed.addEventListener("touchmove", function(e) {

  if (!swiping) return;

  currentY = e.touches[0].clientY;

  /* 普通のスクロールを防止 */

  e.preventDefault();

}, { passive: false });

/* =========================

   指を離す

========================= */

feed.addEventListener("touchend", function(e) {

  if (!swiping) return;

  swiping = false;

  const distance = startY - currentY;

  /*

    下 → 上に60px以上

    スワイプしたら次へ

  */

  if (distance >= 60 && !changing) {

    showNext();

  }

}, { passive: false });

/* =========================

   次の動画

========================= */

function showNext() {

  changing = true;

  /*

    次の動画を上へ

  */

  next.style.transform = "translateY(0)";

  current.style.transform = "translateY(-100%)";

  setTimeout(function() {

    /*

      ★重要★

      nextもcurrentも

      同じ short.mp4。

      だから何回スワイプしても

      同じ動画が出る。

    */

    current.style.transition = "none";

    next.style.transition = "none";

    current.style.transform = "translateY(0)";

    next.style.transform = "translateY(100%)";

    /* 動画を最初から再生 */

    current.currentTime = 0;

    current.play();

    next.currentTime = 0;

    next.play();

    requestAnimationFrame(function() {

      requestAnimationFrame(function() {

        current.style.transition =

          "transform 0.35s ease";

        next.style.transition =

          "transform 0.35s ease";

        changing = false;

      });

    });

  }, 350);

}

/* =========================

   スクロール完全禁止

========================= */

document.addEventListener("touchmove", function(e) {

  e.preventDefault();

}, { passive: false });

</script>

</body>

</html>
